name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml  # zizmor: ignore[self-repository]

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # the GitHub release
      packages: write  # the images on GHCR
    env:
      IMAGE: ghcr.io/raphaeldkhn/miroir
      MAIN_IMAGE: ghcr.io/raphaeldkhn/miroir-main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Build the static binaries
        run: |
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            uvx --from cargo-zigbuild==0.24.0 cargo-zigbuild zigbuild \
              --release --locked --target "$target"
          done
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/miroir dist/miroir-amd64
          cp target/aarch64-unknown-linux-musl/release/miroir dist/miroir-arm64
          (cd dist && sha256sum miroir-* > SHA256SUMS)
      - name: The binary's version is the tag's
        run: |
          built=$(dist/miroir-amd64 --version)
          if [ "$built" != "miroir ${GITHUB_REF_NAME#v}" ]; then
            echo "::error::$GITHUB_REF_NAME holds $built: set Cargo.toml's version, then tag again"
            exit 1
          fi
      - name: Image tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags="$IMAGE:$version,$IMAGE:${version%.*}"
            main_tags="$MAIN_IMAGE:$version,$MAIN_IMAGE:${version%.*}"
            prerelease=false
          else
            tags="$IMAGE:$version"
            main_tags="$MAIN_IMAGE:$version"
            prerelease=true
          fi
          {
            echo "tags=$tags"
            echo "main_tags=$main_tags"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      # Both images run their package manager for arm64, which an amd64 runner does under QEMU.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: main.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.main_tags }}
      - name: GitHub release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.tags.outputs.prerelease }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --prerelease="$PRERELEASE"
