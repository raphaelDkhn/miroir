version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # Dependabot reads FROM lines only, so the Gitea image pinned in an ARG of
  # examples/gitea/Dockerfile.miroir is not among these.
  - package-ecosystem: docker
    directories: [/, /fixtures/acme-crm]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /fixtures/acme-crm
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      acme-crm:
        patterns: ["*"]
