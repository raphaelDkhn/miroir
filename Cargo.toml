[package]
name = "miroir"
version = "0.0.2"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.38", features = ["serde"] }
mail-parser = "1.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rustix = { version = "1.1.5", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "raw_value", "unbounded_depth"] }
serde_path_to_error = "0.1.20"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "sqlite-bundled"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[profile.release]
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
