split: train
world: north
instruction: >-
  Tomorrow, cancel order 1012. Use wait to let time pass.
max_steps: 10
checks:
  - name: cancelled
    weight: 1.0
    by: 2000
    sql: SELECT status = 'cancelled' FROM orders WHERE id = 1012
allowed_changes:
  - {table: orders, op: update, columns: [status, updated_at]}
  - {table: products, op: update, columns: [stock, updated_at]}
golden:
  - {tool: wait, arguments: {minutes: 1500}}
  - {tool: api_request, arguments: {method: POST, path: /orders/1012/cancel}}
  - {tool: submit}
