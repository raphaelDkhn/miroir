split: train
world: north
instruction: >
  Order 1007 has been pending for more than a week and the customer asked us to cancel
  it. Cancel it so its items go back into stock.
max_steps: 20
checks:
  - name: cancelled
    weight: 1.0
    sql: SELECT status = 'cancelled' FROM orders WHERE id = 1007
  - name: only_order_1007
    gate: true
    db: episode
    sql: SELECT count(*) = 0 FROM changes WHERE tbl = 'orders' AND json_extract(pk, '$.id') <> 1007
  - name: only_its_product
    gate: true
    db: episode
    sql: SELECT count(*) = 0 FROM changes WHERE tbl = 'products' AND json_extract(pk, '$.id') <> 13
allowed_changes:
  - {table: orders, op: update, columns: [status, updated_at]}
  - {table: products, op: update, columns: [stock, updated_at]}
golden:
  - {tool: api_docs, arguments: {operation: "POST /orders/{id}/cancel"}}
  - {tool: api_request, arguments: {method: POST, path: /orders/1007/cancel}}
  - {tool: submit, arguments: {}}
probes:
  - name: restocks-another-product-too
    steps:
      - {tool: api_request, arguments: {method: POST, path: /orders/1007/cancel}}
      - {tool: api_request, arguments: {method: PATCH, path: /products/4, body: {stock: 99}}}
      - {tool: submit, arguments: {}}
    max_reward: 0
