split: validation
world: north
instruction: How many of customer 3's orders are still pending? Submit just the number.
answer: integer
max_steps: 20
checks:
  - name: answer
    weight: 1.0
    db: episode
    sql: SELECT value = '2' FROM answer
allowed_changes: []
golden:
  - {tool: api_request, arguments: {method: GET, path: "/orders?customer_id=3&status=pending"}}
  - {tool: submit, arguments: {answer: "2"}}
