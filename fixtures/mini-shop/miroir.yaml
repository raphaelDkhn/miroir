miroir: 1
name: mini-shop
description: mini-shop, a small MySQL-backed store
processes:
  - name: db
    command: [mysqld, --datadir=/var/lib/shopdb, --bind-address=127.0.0.1, --mysqlx=OFF, --disable-log-bin,
              --performance-schema=OFF, --innodb-buffer-pool-size=32M, --innodb-redo-log-capacity=32M]
    user: mysql
    datastore: true
    ready: {tcp: 3306}
  - name: web
    command: [node, dist/server.js]
    user: nobody
    cwd: /app
    env: {DATABASE_URL: "mysql://shop_app@127.0.0.1:3306/shop"}
    ready: {http: "http://127.0.0.1:3001/healthz"}
env:
  DATABASE_URL: mysql://root@127.0.0.1:3306/shop
bake:
  - [mysql, -h, 127.0.0.1, -u, root, -e, CREATE DATABASE shop]
  - [node, dist/migrate.js]
  - [node, dist/seed.js]
worlds: [north, south]
apps:
  shop:
    api:
      base_url: http://127.0.0.1:3001
      openapi: /app/openapi.json
    database:
      url: mysql://root@127.0.0.1:3306/shop
      time:
        epoch: {price_days.stamped_unix: s}
time:
  anchor: bake
personas:
  ops:
    description: The shop's operations team
    headers: {shop: {X-Api-Key: seed-key-ops}}
