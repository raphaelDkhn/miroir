instruction: >
  The Soylent rollout (deal 1100) closed in the East office. Mark it won there, then leave a note
  on deal 1100 in the West office saying that East closed it. Leave the West deal itself open.
max_steps: 20
checks:
  - {name: won, weight: 0.4, app: east,
     sql: "SELECT status = 'won' AND stage = 'won' FROM deals WHERE id = 1100"}
  - {name: noted, weight: 0.4, app: west,
     sql: "SELECT count(*) = 1 FROM notes WHERE deal_id = 1100 AND author_id = 2 AND text ILIKE '%east%'"}
  - {name: one_note, weight: 0.2, db: episode,
     sql: "SELECT count(*) = 1 FROM changes WHERE app = 'west' AND tbl = 'notes' AND op = 'insert'"}
  - {name: west_still_open, gate: true, app: west,
     sql: "SELECT status = 'open' FROM deals WHERE id = 1100"}
allowed_changes:
  - {app: east, table: deals, op: update, columns: [status, stage, updated_at]}
  - {app: west, table: notes, op: insert}
  - {app: west, table: activities, op: insert}
golden:
  - {tool: api_request, arguments: {app: east, method: PATCH, path: /deals/1100, body: {status: won, stage: won}}}
  - {tool: api_request, arguments: {app: west, method: POST, path: /deals/1100/notes, body: {text: The East office closed this deal.}}}
  - {tool: submit, arguments: {}}
probes:
  - name: closes-west-too
    steps:
      - {tool: api_request, arguments: {app: east, method: PATCH, path: /deals/1100, body: {status: won, stage: won}}}
      - {tool: api_request, arguments: {app: west, method: POST, path: /deals/1100/notes, body: {text: The East office closed this deal.}}}
      - {tool: api_request, arguments: {app: west, method: PATCH, path: /deals/1100, body: {status: won, stage: won}}}
      - {tool: submit, arguments: {}}
    max_reward: 0
  - name: notes-in-the-east
    steps:
      - {tool: api_request, arguments: {app: east, method: PATCH, path: /deals/1100, body: {status: won, stage: won}}}
      - {tool: api_request, arguments: {app: east, method: POST, path: /deals/1100/notes, body: {text: The East office closed this deal.}}}
      - {tool: submit, arguments: {}}
    max_reward: 0
