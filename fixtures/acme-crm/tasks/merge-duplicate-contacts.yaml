split: train
instruction: >
  Contacts 2045 and 2046 are the same person, Jordan Avery of Initech. Merge 2046 into 2045 so
  all of her deals stay with one contact and the duplicate is gone.
max_steps: 30
checks:
  - name: deals_moved
    weight: 0.6
    sql: SELECT count(*) / 2.0 FROM deals WHERE id IN (3101, 3102) AND contact_id = 2045
  - name: duplicate_removed
    weight: 0.4
    sql: SELECT count(*) = 0 FROM contacts WHERE id = 2046
  - name: kept_contact
    gate: true
    sql: SELECT count(*) = 1 FROM contacts WHERE id = 2045
  - name: only_the_duplicate
    gate: true
    db: episode
    sql: |
      SELECT count(*) = 0 FROM changes
      WHERE (tbl = 'contacts' AND json_extract(pk, '$.id') <> 2046)
         OR (tbl = 'deals' AND json_extract(pk, '$.id') NOT IN (3101, 3102))
allowed_changes:
  - {table: deals, op: update, columns: [contact_id, updated_at]}
  - {table: contacts, op: delete}
golden:
  - {tool: api_docs, arguments: {}}
  - {tool: api_docs, arguments: {operation: mergeContacts}}
  - {tool: api_request, arguments: {method: POST, path: /contacts/2045/merge, body: {duplicate_id: 2046}}}
  - {tool: submit, arguments: {answer: "Merged contact 2046 into 2045."}}
probes:
  - name: merges-another-contact-too
    steps:
      - {tool: api_request, arguments: {method: POST, path: /contacts/2045/merge, body: {duplicate_id: 2046}}}
      - {tool: api_request, arguments: {method: POST, path: /contacts/2045/merge, body: {duplicate_id: 101}}}
      - {tool: submit, arguments: {}}
    max_reward: 0
