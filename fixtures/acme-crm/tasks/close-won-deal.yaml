split: validation
instruction: >
  The Soylent rollout (deal 1100) just closed. Mark the deal as won, and leave its invoices
  and every other deal as they are.
max_steps: 20
checks:
  - name: won
    weight: 1.0
    sql: SELECT status = 'won' AND stage = 'won' FROM deals WHERE id = 1100
  - name: only_deal_1100
    gate: true
    db: episode
    sql: SELECT count(*) = 0 FROM changes WHERE tbl = 'deals' AND json_extract(pk, '$.id') <> 1100
allowed_changes:
  - {table: deals, op: update, columns: [status, stage, updated_at]}
golden:
  - {tool: api_request, arguments: {method: GET, path: /deals/1100}}
  - {tool: api_request, arguments: {method: PATCH, path: /deals/1100, body: {status: won, stage: won}}}
  - {tool: submit, arguments: {answer: "Deal 1100 is won."}}
probes:
  - name: closes-another-deal-too
    steps:
      - {tool: api_request, arguments: {method: PATCH, path: /deals/1100, body: {status: won, stage: won}}}
      - {tool: api_request, arguments: {method: PATCH, path: /deals/1043, body: {status: won, stage: won}}}
      - {tool: submit, arguments: {}}
    max_reward: 0
  - name: voids-its-invoice
    steps:
      - {tool: api_request, arguments: {method: PATCH, path: /deals/1100, body: {status: won, stage: won}}}
      - {tool: api_request, arguments: {method: POST, path: /invoices/4020/void}}
      - {tool: submit, arguments: {}}
    max_reward: 0
