split: train
instruction: >
  Deal 2001, the Globex expansion, should move to Marcus Webb. Reassign it to him and make
  sure he gets the usual email about it.
max_steps: 20
checks:
  - name: reassigned
    weight: 0.5
    sql: SELECT count(*) FROM deals WHERE id = 2001 AND owner_id = 7
  - name: emailed
    weight: 0.5
    db: episode
    sql: |
      SELECT count(*) = 1 FROM effects
      WHERE kind = 'email' AND json_array_length(data, '$.to') = 1
        AND json_extract(data, '$.to[0]') = 'marcus@acme.test'
        AND json_extract(data, '$.subject') = 'Deal 2001 is now yours'
  - name: only_deal_2001
    gate: true
    db: episode
    sql: SELECT count(*) = 0 FROM changes WHERE tbl = 'deals' AND json_extract(pk, '$.id') <> 2001
allowed_changes:
  - {table: deals, op: update, columns: [owner_id, updated_at]}
golden:
  - {tool: api_request, arguments: {method: GET, path: "/users?role=rep"}}
  - {tool: api_request, arguments: {method: PATCH, path: /deals/2001, body: {owner_id: 7}}}
  - {tool: submit, arguments: {answer: "Reassigned deal 2001 to Marcus, who was emailed."}}
probes:
  - name: reassigns-another-deal-too
    steps:
      - {tool: api_request, arguments: {method: PATCH, path: /deals/2001, body: {owner_id: 7}}}
      - {tool: api_request, arguments: {method: PATCH, path: /deals/1100, body: {owner_id: 7}}}
      - {tool: submit, arguments: {}}
    max_reward: 0
