# The experiment README.md describes, as Hosted RL on Prime Intellect: Qwen3.5-9B trains on the
# train split, and the orchestrator evaluates it on four held-out sources before the first step
# and every 20 steps after. The train split is nine families in the orbit and ferry worlds;
# validation holds their other tasks there and three families training never sees; test is the
# kestrel world, which training never sees. `with_pool.py` adds the pool's URLs and token to
# every source. Tasks with coworkers need a coworker model, which the adapter here has none of,
# so it leaves them out.
mode = "rl"
name = "gitea-heldout-qwen3.5-9b"
max_steps = 60
# A whole episode is one sample: every turn and every API response, which Gitea makes long.
seq_len = 32768
gpu_type = "RTX_PRO_6000B_96GB"

[model]
name = "Qwen/Qwen3.5-9B"

[deployment]
num_train_gpus = 2
num_infer_gpus = 1

[trainer.optim]
lr = 1e-6

[inference]

[orchestrator]
# Eight rollouts of each of five tasks a step.
batch_size = 40

[orchestrator.concurrency]
# One container per rollout in flight: the size of the pool.
initial_inflight = 40
max_inflight = 40

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = false

[orchestrator.train]
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 4096

[[orchestrator.train.source]]
name = "train"
env.taskset.id = "raphaeldkhn/miroir-verifiers"
env.taskset.split = "train"
# Harm (a change the task doesn't allow, or a failed gate) earns less than doing nothing.
env.taskset.harm_reward = -0.5
env.taskset.max_seconds = 900

[orchestrator.eval]
interval = 20
group_size = 2

[orchestrator.eval.sampling]
max_completion_tokens = 4096

# The held-out families' tasks; the other sources leave them out.
[[orchestrator.eval.source]]
name = "validation-trained-families"
env.taskset.id = "raphaeldkhn/miroir-verifiers"
env.taskset.split = "validation"
env.taskset.harm_reward = -0.5
env.taskset.max_seconds = 900
select.exclude.ids = [
  "ship-release.orbit.1", "ship-release.orbit.2", "ship-release.orbit.3", "ship-release.orbit.4",
  "ship-release.ferry.1", "ship-release.ferry.2", "ship-release.ferry.3", "ship-release.ferry.4",
  "redact-secret.orbit.1", "redact-secret.orbit.2", "redact-secret.orbit.3", "redact-secret.orbit.4",
  "redact-secret.ferry.1", "redact-secret.ferry.2", "redact-secret.ferry.3", "redact-secret.ferry.4",
]

[[orchestrator.eval.source]]
name = "validation-held-out-families"
env.taskset.id = "raphaeldkhn/miroir-verifiers"
env.taskset.split = "validation"
env.taskset.harm_reward = -0.5
env.taskset.max_seconds = 900
select.include.ids = [
  "ship-release.orbit.1", "ship-release.orbit.2", "ship-release.orbit.3", "ship-release.orbit.4",
  "ship-release.ferry.1", "ship-release.ferry.2", "ship-release.ferry.3", "ship-release.ferry.4",
  "redact-secret.orbit.1", "redact-secret.orbit.2", "redact-secret.orbit.3", "redact-secret.orbit.4",
  "redact-secret.ferry.1", "redact-secret.ferry.2", "redact-secret.ferry.3", "redact-secret.ferry.4",
]

[[orchestrator.eval.source]]
name = "test-trained-families"
env.taskset.id = "raphaeldkhn/miroir-verifiers"
env.taskset.split = "test"
env.taskset.harm_reward = -0.5
env.taskset.max_seconds = 900
select.exclude.ids = [
  "ship-release.kestrel.1", "ship-release.kestrel.2", "ship-release.kestrel.3",
  "ship-release.kestrel.4", "redact-secret.kestrel.1", "redact-secret.kestrel.2",
  "redact-secret.kestrel.3", "redact-secret.kestrel.4",
]

[[orchestrator.eval.source]]
name = "test-held-out-families"
env.taskset.id = "raphaeldkhn/miroir-verifiers"
env.taskset.split = "test"
env.taskset.harm_reward = -0.5
env.taskset.max_seconds = 900
select.include.ids = [
  "ship-release.kestrel.1", "ship-release.kestrel.2", "ship-release.kestrel.3",
  "ship-release.kestrel.4", "redact-secret.kestrel.1", "redact-secret.kestrel.2",
  "redact-secret.kestrel.3", "redact-secret.kestrel.4",
]
