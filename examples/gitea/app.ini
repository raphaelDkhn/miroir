; Gitea's config in the world image. Gitea itself is the stock image; this file only points it
; at the world's Postgres and Miroir's sinks, and turns off what would act on its own while idle.
; `seed.py configure` sets APP_NAME and the mailer's FROM per world at bake.
APP_NAME = Gitea
RUN_USER = git
RUN_MODE = prod
WORK_PATH = /var/lib/gitea

[server]
PROTOCOL = http
; Off loopback: port 3000 is the world's one exposed port, where the agent reaches Gitea as
; http://gitea:3000, the world's service name in each task's compose file.
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
DOMAIN = gitea
ROOT_URL = http://gitea:3000/
LOCAL_ROOT_URL = http://127.0.0.1:3000/
APP_DATA_PATH = /var/lib/gitea/data
OFFLINE_MODE = true
DISABLE_SSH = true
START_SSH_SERVER = false
SSH_CREATE_AUTHORIZED_KEYS_FILE = false
SSH_CREATE_AUTHORIZED_PRINCIPALS_FILE = false
LFS_START_SERVER = false
LFS_JWT_SECRET_URI = file:/etc/gitea/lfs_jwt_secret

[database]
DB_TYPE = postgres
HOST = 127.0.0.1:5432
NAME = gitea
USER = gitea
PASSWD =
SSL_MODE = disable

[repository]
ROOT = /var/lib/gitea/repositories
DEFAULT_BRANCH = main

[security]
INSTALL_LOCK = true
; Generated at image build, as are the JWT secrets below, so no secret is in this file.
SECRET_KEY_URI = file:/etc/gitea/secret_key
INTERNAL_TOKEN_URI = file:/etc/gitea/internal_token
; Webhooks may call Miroir's HTTP sink, and nothing else.
EGRESS_MODE = strict
ALLOWED_HOST_LIST = 127.0.0.1:9000

[oauth2]
ENABLED = false
JWT_SECRET_URI = file:/etc/gitea/jwt_secret

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = true
ENABLE_NOTIFY_MAIL = true

[admin]
; People are emailed when someone mentions them, as many teams set it.
DEFAULT_EMAIL_NOTIFICATIONS = onmention

[mailer]
ENABLED = true
PROTOCOL = smtp
SMTP_ADDR = 127.0.0.1
SMTP_PORT = 2525
FROM = Gitea <gitea@gitea.test>

[queue]
; In memory: `gitea manager flush-queues`, the manifest's quiet command, waits them out.
TYPE = channel

[indexer]
ISSUE_INDEXER_TYPE = db

[session]
PROVIDER = memory

[cache]
ADAPTER = memory

[log]
MODE = console
LEVEL = warn

[actions]
ENABLED = false

[packages]
ENABLED = false

; Gitea's basic cron tasks run by default, some at start; none may act while the env idles.
[cron.archive_cleanup]
ENABLED = false
[cron.update_mirrors]
ENABLED = false
[cron.repo_health_check]
ENABLED = false
[cron.check_repo_stats]
ENABLED = false
[cron.update_migration_poster_id]
ENABLED = false
[cron.sync_external_users]
ENABLED = false
[cron.cleanup_actions]
ENABLED = false
[cron.cleanup_action_runs]
ENABLED = false
[cron.deleted_branches_cleanup]
ENABLED = false
[cron.cleanup_hook_task_table]
ENABLED = false
[cron.cleanup_packages]
ENABLED = false
[cron.sync_repo_licenses]
ENABLED = false
