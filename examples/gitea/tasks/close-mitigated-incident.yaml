split: test
instruction: >-
  orbit/infra#12 tracks an ongoing incident. Sam Ortiz (sam), the on-call engineer, will
  comment on it once it's mitigated. Within 30 minutes of Sam's comment, close the incident and
  swap its incident/active label for incident/resolved, as the incident runbook says. Use wait
  to let time pass; it ends early when something happens.
max_steps: 15
# Issue 76 is orbit/infra#12, user 6 is Sam, and labels 52 and 53 are infra's incident/active
# and incident/resolved. Sam's comment arrives at minute 50; the check scores at minute 80.
events:
  - name: mitigated
    at: 50
    headers: {gitea: {Authorization: token a167834207cad6a0f5c20bf08c8ceb319254044d}}
    request:
      method: POST
      path: /repos/orbit/infra/issues/12/comments
      body: {body: "Mitigated: rolled api back to v2.3.1, and the error rate is back to baseline."}
checks:
  - name: resolved_in_time
    weight: 1.0
    by: 80
    sql: |
      SELECT i.is_closed AND i.closed_unix >= c.created_unix
         AND EXISTS (SELECT 1 FROM issue_label WHERE issue_id = 76 AND label_id = 53)
         AND NOT EXISTS (SELECT 1 FROM issue_label WHERE issue_id = 76 AND label_id = 52)
      FROM issue i JOIN comment c ON c.issue_id = i.id
      WHERE i.id = 76 AND c.poster_id = 6 AND c.content LIKE 'Mitigated:%'
  - name: only_the_incident
    gate: true
    db: episode
    sql: |
      SELECT count(*) = 0 FROM changes
      WHERE (tbl = 'issue' AND json_extract(pk, '$.id') <> 76 AND coalesce(columns, '') <> '["updated_unix"]')
         OR (tbl IN ('comment', 'issue_label')
             AND json_extract(coalesce(after, before), '$.issue_id') <> 76
             AND coalesce(json_extract(after, '$.ref_issue_id'), 0) <> 76)
allowed_changes:
  - {table: comment, op: insert}
  - {table: issue, op: update, columns: [is_closed, closed_unix, num_comments, updated_unix]}
  - {table: issue_label, op: insert}
  - {table: issue_label, op: delete}
  - {table: label, op: update, columns: [num_issues, num_closed_issues, updated_unix]}
  - {table: repository, op: update, columns: [num_closed_issues]}
golden:
  - {tool: api_request, arguments: {method: GET, path: /repos/orbit/infra/raw/runbooks/incidents.md}}
  - {tool: wait, arguments: {minutes: 600}}
  - {tool: api_request, arguments: {method: GET, path: /repos/orbit/infra/issues/12/comments}}
  - {tool: api_request, arguments: {method: PUT, path: /repos/orbit/infra/issues/12/labels, body: {labels: [incident/resolved]}}}
  - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/infra/issues/12, body: {state: closed}}}
  - {tool: submit, arguments: {answer: "Closed orbit/infra#12 as resolved."}}
probes:
  - name: closes-it-before-sam-says-so
    steps:
      - {tool: api_request, arguments: {method: PUT, path: /repos/orbit/infra/issues/12/labels, body: {labels: [incident/resolved]}}}
      - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/infra/issues/12, body: {state: closed}}}
      - {tool: submit, arguments: {}}
    max_reward: 0
  - name: closes-it-late
    steps:
      - {tool: wait, arguments: {minutes: 600}}
      - {tool: wait, arguments: {minutes: 45}}
      - {tool: api_request, arguments: {method: PUT, path: /repos/orbit/infra/issues/12/labels, body: {labels: [incident/resolved]}}}
      - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/infra/issues/12, body: {state: closed}}}
      - {tool: submit, arguments: {}}
    max_reward: 0
  - name: closes-it-but-keeps-the-active-label
    steps:
      - {tool: wait, arguments: {minutes: 600}}
      - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/infra/issues/12, body: {state: closed}}}
      - {tool: submit, arguments: {}}
    max_reward: 0
