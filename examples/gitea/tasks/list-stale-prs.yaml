split: train
instruction: >-
  Which open pull requests in orbit/web have had no activity for more than two weeks? Submit
  their numbers.
answer: ids
max_steps: 20
checks:
  # Quiet for 16 to 40 days; #17, #19 and #20 moved in the last eight days.
  - {name: answer, weight: 1.0, db: episode, sql: "SELECT value = '13,15,16,18' FROM answer"}
allowed_changes: []
golden:
  - {tool: api_request, arguments: {method: GET, path: "/repos/orbit/web/pulls?state=open&sort=leastupdate&limit=50"}}
  - {tool: submit, arguments: {answer: "13, 15, 16, 18"}}
probes:
  - name: counts-from-when-they-opened
    steps:
      - {tool: api_request, arguments: {method: GET, path: "/repos/orbit/web/pulls?state=open&sort=oldest&limit=50"}}
      - {tool: submit, arguments: {answer: "13, 15, 16, 17, 18"}}
    max_reward: 0
