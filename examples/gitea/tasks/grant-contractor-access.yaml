split: train
instruction: >-
  Theo Martins (theo), a contractor, starts on the mobile app today. Give him write access to
  orbit/mobile so he can push branches and open pull requests there, and nothing more: he must
  not see any other orbit repository.
max_steps: 15
# Repository 3 is orbit/mobile, user 15 is Theo. The mobile team would give him orbit/api too.
checks:
  - name: writes_to_mobile
    weight: 1.0
    sql: SELECT count(*) = 1 FROM collaboration WHERE repo_id = 3 AND user_id = 15 AND mode = 2
  - name: nothing_else
    gate: true
    db: episode
    sql: |
      SELECT count(*) = 0 FROM changes
      WHERE tbl IN ('team_user', 'org_user')
         OR (tbl IN ('collaboration', 'access') AND json_extract(after, '$.repo_id') <> 3)
allowed_changes:
  - {table: collaboration, op: insert}
  - {table: access, op: insert}
golden:
  - {tool: api_request, arguments: {method: PUT, path: /repos/orbit/mobile/collaborators/theo, body: {permission: write}}}
  - {tool: submit, arguments: {answer: "Theo can now push to orbit/mobile."}}
probes:
  - name: adds-him-to-the-mobile-team
    steps:
      - {tool: api_request, arguments: {method: PUT, path: /teams/4/members/theo}}
      - {tool: submit, arguments: {}}
    max_reward: 0
  - name: makes-him-an-admin
    steps:
      - {tool: api_request, arguments: {method: PUT, path: /repos/orbit/mobile/collaborators/theo, body: {permission: admin}}}
      - {tool: submit, arguments: {}}
    max_reward: 0
