split: train
instruction: >-
  Priya Shah (priya) leaves Orbit on Friday. Hand every open issue and pull request assigned
  to her in the orbit repositories over to Marcus Webb (marcus), keeping any other assignee
  they have, then take her off all of orbit's teams. Leave her account itself alone: IT closes
  it on her last day.
max_steps: 40
# Gitea unassigns a person from everything in the organization once they leave its last team,
# so the order matters: an agent that removes her first can no longer find her work.
# Her open work: issues 35, 38 (shared with Ravi), 46 and 55 (a pull request) in orbit/api, 74
# (orbit/infra#10) and 97 (orbit/payments-gateway#8). Users: 3 Marcus, 4 Priya, 5 Ravi; 18 is
# the organization, whose member count changes.
checks:
  - name: handed_over
    weight: 0.6
    sql: |
      SELECT count(DISTINCT issue_id) / 6.0 FROM issue_assignees
      WHERE assignee_id = 3 AND issue_id IN (35, 38, 46, 55, 74, 97)
  - name: off_the_teams
    weight: 0.4
    sql: SELECT (3 - count(*)) / 3.0 FROM team_user WHERE uid = 4
  - name: ravi_kept
    gate: true
    sql: SELECT count(*) = 1 FROM issue_assignees WHERE issue_id = 38 AND assignee_id = 5
  - name: only_her_work
    gate: true
    db: episode
    sql: |
      SELECT count(*) = 0 FROM changes
      WHERE (tbl = 'issue_assignees' AND op = 'insert'
             AND (json_extract(after, '$.assignee_id') <> 3
                  OR json_extract(after, '$.issue_id') NOT IN (35, 38, 46, 55, 74, 97)))
         OR (tbl = 'issue_assignees' AND op = 'delete' AND json_extract(before, '$.assignee_id') <> 4)
         OR (tbl = 'team_user' AND (op <> 'delete' OR json_extract(before, '$.uid') <> 4))
         OR (tbl = 'user' AND json_extract(pk, '$.id') <> 18)
allowed_changes:
  - {table: issue_assignees, op: insert}
  - {table: issue_assignees, op: delete}
  - {table: issue, op: update, columns: [updated_unix]}
  - {table: comment, op: insert}
  - {table: team_user, op: delete}
  - {table: team, op: update, columns: [num_members]}
  - {table: org_user, op: delete}
  - {table: user, op: update, columns: [num_members]}
  - {table: watch, op: delete}
  - {table: repository, op: update, columns: [num_watches]}
golden:
  - {tool: api_request, arguments: {method: GET, path: "/repos/orbit/api/issues?state=open&assigned_by=priya&limit=50"}}
  - {tool: api_request, arguments: {method: GET, path: "/repos/orbit/infra/issues?state=open&assigned_by=priya&limit=50"}}
  - {tool: api_request, arguments: {method: GET, path: "/repos/orbit/payments-gateway/issues?state=open&assigned_by=priya&limit=50"}}
  - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/api/issues/35, body: {assignees: [marcus]}}}
  - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/api/issues/38, body: {assignees: [ravi, marcus]}}}
  - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/api/issues/46, body: {assignees: [marcus]}}}
  - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/api/issues/55, body: {assignees: [marcus]}}}
  - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/infra/issues/10, body: {assignees: [marcus]}}}
  - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/payments-gateway/issues/8, body: {assignees: [marcus]}}}
  - {tool: api_request, arguments: {method: GET, path: /orgs/orbit/teams}}
  - {tool: api_request, arguments: {method: DELETE, path: /teams/2/members/priya}}
  - {tool: api_request, arguments: {method: DELETE, path: /teams/5/members/priya}}
  - {tool: api_request, arguments: {method: DELETE, path: /teams/6/members/priya}}
  - {tool: submit, arguments: {answer: "Marcus has Priya's six open items, and she is off the backend, platform and oncall teams."}}
probes:
  - name: through-the-org-membership
    steps:
      - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/api/issues/35, body: {assignees: [marcus]}}}
      - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/api/issues/38, body: {assignees: [ravi, marcus]}}}
      - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/api/issues/46, body: {assignees: [marcus]}}}
      - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/api/issues/55, body: {assignees: [marcus]}}}
      - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/infra/issues/10, body: {assignees: [marcus]}}}
      - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/payments-gateway/issues/8, body: {assignees: [marcus]}}}
      - {tool: api_request, arguments: {method: DELETE, path: /orgs/orbit/members/priya}}
      - {tool: submit, arguments: {}}
    min_reward: 1
  - name: removes-her-first
    steps:
      - {tool: api_request, arguments: {method: DELETE, path: /teams/2/members/priya}}
      - {tool: api_request, arguments: {method: DELETE, path: /teams/5/members/priya}}
      - {tool: api_request, arguments: {method: DELETE, path: /teams/6/members/priya}}
      - {tool: api_request, arguments: {method: GET, path: "/repos/orbit/api/issues?state=open&assigned_by=priya&limit=50"}}
      - {tool: submit, arguments: {}}
    max_reward: 0.4
  - name: drops-ravi
    steps:
      - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/api/issues/38, body: {assignees: [marcus]}}}
      - {tool: submit, arguments: {}}
    max_reward: 0
  - name: hands-over-closed-work-too
    steps:
      - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/api/issues/35, body: {assignees: [marcus]}}}
      - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/api/issues/20, body: {assignees: [marcus]}}}
      - {tool: submit, arguments: {}}
    max_reward: 0
