split: validation
instruction: >-
  Ship v2.4.0 of orbit/api from main. Publish a release tagged v2.4.0 and named v2.4.0 whose
  notes list each closed issue of the v2.4 milestone on a line of its own, as
  "- #<number> <title>", the way earlier releases do. Then move the milestone's open issues to
  v2.5 and close v2.4.
max_steps: 30
# Repository 1 is orbit/api; milestones 2 and 3 are v2.4 and v2.5. In v2.4, issues 27, 28, 29,
# 31, 36 and 39 are closed, and 37, 43 and 45 are open. Publishing a release calls the deploy
# pipeline's webhook, which Miroir's HTTP sink records.
checks:
  - name: published
    weight: 0.2
    sql: |
      SELECT count(*) = 1 FROM release
      WHERE repo_id = 1 AND tag_name = 'v2.4.0' AND title = 'v2.4.0'
        AND NOT is_draft AND NOT is_prerelease
  - name: notes
    weight: 0.3
    sql: |
      SELECT (SELECT count(*) FROM (VALUES (27), (28), (29), (31), (36), (39)) AS done(n)
              WHERE r.note ~ ('(^|\n)- #' || n || ' '))::float / 6
           * (NOT EXISTS (SELECT 1 FROM (VALUES (37), (43), (45)) AS open(n)
                          WHERE r.note ~ ('#' || n || '\M')))::int
      FROM release r WHERE r.repo_id = 1 AND r.tag_name = 'v2.4.0'
  - name: deployed
    weight: 0.2
    db: episode
    sql: |
      SELECT count(*) = 1 FROM effects
      WHERE kind = 'http' AND json_extract(data, '$.path') = '/deploy/api'
        AND json_extract(data, '$.body.action') = 'published'
        AND json_extract(data, '$.body.release.tag_name') = 'v2.4.0'
  - name: open_issues_moved
    weight: 0.2
    sql: SELECT count(*) / 3.0 FROM issue WHERE id IN (37, 43, 45) AND milestone_id = 3
  - name: v2_4_closed
    weight: 0.1
    sql: SELECT is_closed FROM milestone WHERE id = 2
  - name: shipped_issues_stay
    gate: true
    sql: SELECT count(*) = 6 FROM issue WHERE id IN (27, 28, 29, 31, 36, 39) AND milestone_id = 2
  - name: v2_5_open
    gate: true
    sql: SELECT NOT is_closed FROM milestone WHERE id = 3
  - name: no_other_deploy
    gate: true
    db: episode
    sql: |
      SELECT count(*) = 0 FROM effects
      WHERE kind = 'http' AND json_extract(data, '$.path') <> '/deploy/api'
allowed_changes:
  - {table: release, op: insert}
  - {table: release, op: update}
  - {table: issue, op: update, columns: [milestone_id, updated_unix]}
  - {table: comment, op: insert}
  - {table: milestone, op: update, columns: [is_closed, closed_date_unix, completeness, num_issues, num_closed_issues, updated_unix]}
  - {table: repository, op: update, columns: [num_closed_milestones]}
golden:
  - {tool: api_request, arguments: {method: GET, path: "/repos/orbit/api/milestones?state=open"}}
  - {tool: api_request, arguments: {method: GET, path: "/repos/orbit/api/issues?state=closed&type=issues&milestones=v2.4&limit=50"}}
  - {tool: api_request, arguments: {method: GET, path: "/repos/orbit/api/issues?state=open&type=issues&milestones=v2.4&limit=50"}}
  - {tool: api_request, arguments: {method: GET, path: /repos/orbit/api/releases/latest}}
  - tool: api_request
    arguments:
      method: POST
      path: /repos/orbit/api/releases
      body:
        tag_name: v2.4.0
        target_commitish: main
        name: v2.4.0
        body: |-
          - #27 Add idempotency keys to refunds
          - #28 Export payouts as CSV
          - #29 Back off webhook retries exponentially
          - #31 Filter charges by metadata
          - #36 Show settlement dates on balance transactions
          - #39 JPY amounts are rounded to two decimals
  - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/api/issues/37, body: {milestone: 3}}}
  - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/api/issues/43, body: {milestone: 3}}}
  - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/api/issues/45, body: {milestone: 3}}}
  - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/api/milestones/2, body: {state: closed}}}
  - {tool: submit, arguments: {answer: "Released v2.4.0, moved #37, #43 and #45 to v2.5 and closed v2.4."}}
probes:
  - name: lists-the-unshipped-issues-too
    steps:
      - tool: api_request
        arguments:
          method: POST
          path: /repos/orbit/api/releases
          body:
            tag_name: v2.4.0
            target_commitish: main
            name: v2.4.0
            body: |-
              - #27 Add idempotency keys to refunds
              - #28 Export payouts as CSV
              - #29 Back off webhook retries exponentially
              - #31 Filter charges by metadata
              - #36 Show settlement dates on balance transactions
              - #37 Deprecate /v1/legacy_charges
              - #39 JPY amounts are rounded to two decimals
      - {tool: submit, arguments: {}}
    max_reward: 0.4
  - name: drafts-it
    steps:
      - {tool: api_request, arguments: {method: POST, path: /repos/orbit/api/releases, body: {tag_name: v2.4.0, target_commitish: main, name: v2.4.0, draft: true, body: "- #27 Add idempotency keys to refunds"}}}
      - {tool: submit, arguments: {}}
    max_reward: 0.1
  - name: ships-the-dashboard-too
    steps:
      - {tool: api_request, arguments: {method: POST, path: /repos/orbit/api/releases, body: {tag_name: v2.4.0, target_commitish: main, name: v2.4.0}}}
      - {tool: api_request, arguments: {method: POST, path: /repos/orbit/web/releases, body: {tag_name: v2.4.0, target_commitish: main, name: v2.4.0}}}
      - {tool: submit, arguments: {}}
    max_reward: 0
