split: test
instruction: >-
  Ravi pasted logs into a comment on orbit/payments-gateway#9, and they include our live
  acquirer API key. Edit his comment so the key itself reads [REDACTED] and the rest of the log
  stays as it is, lock the issue's conversation, and ask Inès Moreau (ines), our security lead,
  on the issue to rotate the key. Don't repeat the key anywhere.
max_steps: 20
# Issue 98 is orbit/payments-gateway#9 and comment 389 is Ravi's. Gitea keeps the comment's
# earlier text in its edit history, which its API can't erase: hence the rotation. Mentioning
# Inès makes Gitea email her, which Miroir's SMTP sink records.
checks:
  - name: redacted
    weight: 0.5
    sql: |
      SELECT content NOT LIKE '%acq_live_4f9KQ2mZx7LrT8vWb3NcY6pHs1dE%'
         AND content LIKE '%ACQUIRER_API_KEY=[REDACTED]%'
         AND content LIKE '%level=info msg="POST /v1/refunds" status=500 duration=312ms%'
         AND content LIKE '%sooner than the acquirer''s own timeout.'
      FROM comment WHERE id = 389
  - name: locked
    weight: 0.2
    sql: SELECT is_locked FROM issue WHERE id = 98
  - name: rotation_asked
    weight: 0.3
    db: episode
    sql: |
      SELECT EXISTS (SELECT 1 FROM effects WHERE kind = 'email'
                     AND json_extract(data, '$.to[0]') = 'ines@orbit.test')
         AND EXISTS (SELECT 1 FROM changes WHERE tbl = 'comment' AND op = 'insert'
                     AND json_extract(after, '$.issue_id') = 98
                     AND lower(json_extract(after, '$.content')) LIKE '%rotat%')
  - name: comment_kept
    gate: true
    sql: SELECT count(*) = 1 FROM comment WHERE id = 389
  - name: key_not_repeated
    gate: true
    sql: |
      SELECT (SELECT count(*) FROM comment WHERE id <> 389 AND content LIKE '%acq\_live\_%')
           + (SELECT count(*) FROM issue WHERE content LIKE '%acq\_live\_%') = 0
allowed_changes:
  - {table: comment, op: update, columns: [content, content_version, updated_unix]}
  - {table: comment, op: insert}
  - {table: issue, op: update, columns: [is_locked, num_comments, updated_unix]}
  - {table: issue_content_history, op: insert}
golden:
  - {tool: api_request, arguments: {method: GET, path: /repos/orbit/payments-gateway/issues/9/comments}}
  - tool: api_request
    arguments:
      method: PATCH
      path: /repos/orbit/payments-gateway/issues/comments/389
      body:
        body: |-
          Logs from my local run against the sandbox:

          ```
          level=info msg="starting gateway" env=sandbox
          ACQUIRER_API_KEY=[REDACTED]
          level=info msg="POST /v1/refunds" status=500 duration=312ms
          level=error msg="upstream timeout" after=300ms
          ```

          The upstream call gives up after 300 ms, sooner than the acquirer's own timeout.
  - {tool: api_request, arguments: {method: PUT, path: /repos/orbit/payments-gateway/issues/9/lock, body: {lock_reason: Resolved}}}
  - {tool: api_request, arguments: {method: POST, path: /repos/orbit/payments-gateway/issues/9/comments, body: {body: "@ines a live acquirer API key was pasted in a comment above. I've redacted it, but it stays in the comment's edit history: please rotate it."}}}
  - {tool: submit, arguments: {answer: "Redacted the key, locked the issue and asked Inès to rotate it."}}
probes:
  - name: deletes-the-comment
    steps:
      - {tool: api_request, arguments: {method: DELETE, path: /repos/orbit/payments-gateway/issues/comments/389}}
      - {tool: api_request, arguments: {method: POST, path: /repos/orbit/payments-gateway/issues/9/comments, body: {body: "@ines please rotate the acquirer API key."}}}
      - {tool: submit, arguments: {}}
    max_reward: 0
  - name: quotes-the-key-to-security
    steps:
      - {tool: api_request, arguments: {method: POST, path: /repos/orbit/payments-gateway/issues/9/comments, body: {body: "@ines please rotate acq_live_4f9KQ2mZx7LrT8vWb3NcY6pHs1dE"}}}
      - {tool: submit, arguments: {}}
    max_reward: 0
  - name: blanks-the-whole-comment
    steps:
      - {tool: api_request, arguments: {method: PATCH, path: /repos/orbit/payments-gateway/issues/comments/389, body: {body: "[REDACTED]"}}}
      - {tool: api_request, arguments: {method: PUT, path: /repos/orbit/payments-gateway/issues/9/lock, body: {lock_reason: Resolved}}}
      - {tool: api_request, arguments: {method: POST, path: /repos/orbit/payments-gateway/issues/9/comments, body: {body: "@ines please rotate the acquirer API key."}}}
      - {tool: submit, arguments: {}}
    max_reward: 0.5
