miroir: 1
name: gitea
description: >-
  Gitea 28.3, the self-hosted Git forge, holding the engineering organization of Orbit, a
  payments company: six repositories, eight teams, and their issues, pull requests and releases
processes:
  # TCP only, with no socket in /run, which a VM such as a Prime sandbox mounts empty at boot.
  - name: db
    command: [postgres, -D, /var/lib/postgresql/data, -c, listen_addresses=127.0.0.1,
              -c, unix_socket_directories=]
    user: postgres
    datastore: true
    ready: {tcp: 5432}
  - name: gitea
    command: [gitea, web, --config, /etc/gitea/app.ini]
    user: git
    cwd: /var/lib/gitea
    ready: {http: "http://127.0.0.1:3000/api/healthz"}
env:
  # The image sets GITEA_CUSTOM to its /data volume, which a reset can't restore, and Gitea
  # wants the work path to match app.ini's.
  GITEA_WORK_DIR: /var/lib/gitea
  GITEA_CUSTOM: /var/lib/gitea/custom
bake:
  - [psql, -h, 127.0.0.1, -U, postgres, -v, ON_ERROR_STOP=1,
     -c, CREATE ROLE gitea LOGIN, -c, CREATE DATABASE gitea OWNER gitea]
  - [su-exec, git, gitea, migrate, --config, /etc/gitea/app.ini]
  - [su-exec, git, gitea, admin, user, create, --config, /etc/gitea/app.ini, --admin,
     --username, orbit-admin, --email, admin@orbit.test, --random-password,
     --must-change-password=false]
seed:
  - [python3, /opt/orbit/seed.py]
state: [/var/lib/postgresql/data, /var/lib/gitea]
apps:
  gitea:
    api:
      base_url: http://127.0.0.1:3000/api/v1
      openapi: /opt/orbit/openapi.json
    database:
      url: postgres://postgres@127.0.0.1:5432/gitea
      # What follows from other changes: the activity feed, notifications, read marks, webhook
      # deliveries and code statistics; and the token's last use, touched on every request.
      ignore: [action, notification, issue_user, hook_task, webhook.last_status,
               webhook.updated_unix, language_stat, repo_indexer_status,
               access_token.updated_unix]
      time:
        epoch: {"*.*_unix": s}
personas:
  eng_manager:
    description: >-
      Dana Lee (dana), engineering manager at Orbit and an owner of its Gitea organization,
      orbit
    headers:
      gitea: {Authorization: token 11964c8449bba23d6f37b8c883725fb9cc838a8e}
sinks:
  smtp: 2525
  http: 9000
quiet:
  command: [su-exec, git, gitea, manager, flush-queues, --config, /etc/gitea/app.ini]
system_prompt: >-
  You are an assistant for the engineering team of Orbit, a payments company. You work in
  Orbit's Gitea, its Git forge, through Gitea's REST API: api_request sends a request as the
  person you act for, and api_docs looks up the API's operations. Repositories are named
  orbit/<name>, issues and pull requests share one number sequence in each repository, and
  lists are paginated with page and limit (at most 50). Do what you are asked and nothing
  more, then call submit.
