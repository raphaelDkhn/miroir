miroir: 1
name: gitea
description: >-
  Gitea 28.3, the self-hosted Git forge, holding the engineering organization of one of three
  companies: a payments company and a logistics company to train on, and a clinic-software
  company held out for test
processes:
  # TCP only, with no socket in /run, which a VM such as a Prime sandbox mounts empty at boot.
  - name: db
    command: [postgres, -D, /var/lib/postgresql/data, -c, listen_addresses=127.0.0.1,
              -c, unix_socket_directories=]
    user: postgres
    datastore: true
    ready: {tcp: 5432}
  - name: gitea
    command: [gitea, web, --config, /etc/gitea/app.ini]
    user: git
    cwd: /var/lib/gitea
    ready: {http: "http://127.0.0.1:3000/api/healthz"}
env:
  # The image sets GITEA_CUSTOM to its /data volume, which a reset can't restore, and Gitea
  # wants the work path to match app.ini's.
  GITEA_WORK_DIR: /var/lib/gitea
  GITEA_CUSTOM: /var/lib/gitea/custom
bake:
  - [psql, -h, 127.0.0.1, -U, postgres, -v, ON_ERROR_STOP=1,
     -c, CREATE ROLE gitea LOGIN, -c, CREATE DATABASE gitea OWNER gitea]
  - [su-exec, git, gitea, migrate, --config, /etc/gitea/app.ini]
  - [su-exec, git, gitea, admin, user, create, --config, /etc/gitea/app.ini, --admin,
     --username, env-admin, --email, admin@env.test, --random-password,
     --must-change-password=false]
# Builds MIROIR_WORLD's company through Gitea's API, then writes its tasks to /miroir/tasks.
seed:
  - [python3, /opt/gitea-env/seed.py]
worlds: [orbit, ferry, kestrel]
state: [/var/lib/postgresql/data, /var/lib/gitea]
apps:
  gitea:
    api:
      base_url: http://127.0.0.1:3000/api/v1
      openapi: /opt/gitea-env/openapi.json
      # What the agent can't use and every object repeats: links to downloads outside the API,
      # each pull request's two copies of its repository, the fields of migrated content, label
      # colors, issues' edit versions, pins and estimates, and a user's account details beyond
      # who they are. Each bare key names nothing else in the spec; the keys in braces also name
      # a repository's or a webhook's fields, so they go only from the users held under those
      # keys. An issue's html_url stays: its /pulls/ path is how Qwen3.5-9B told a pull request
      # from an issue in count-issues.
      omit: [avatar_url, clone_url, ssh_url, diff_url, patch_url, original_url,
             languages_url, tarball_url, zipball_url, upload_url, browser_download_url,
             head.repo, base.repo, original_author, original_author_id, color, content_version,
             pin_order, time_estimate, login_name, source_id, last_login, prohibit_login,
             restricted, followers_count, following_count, starred_repos_count, pronouns,
             "{user,assignee,assignees,requested_reviewers,merged_by,owner}.{active,created,\
             description,html_url,is_admin,language,location,visibility,website,username}"]
    database:
      url: postgres://postgres@127.0.0.1:5432/gitea
      # What follows from other changes: the activity feed, notifications, read marks, webhook
      # deliveries and code statistics; and the token's last use, touched on every request.
      ignore: [action, notification, issue_user, hook_task, webhook.last_status,
               webhook.updated_unix, language_stat, repo_indexer_status,
               access_token.updated_unix]
      time:
        epoch: {"*.*_unix": s}
# One manager per world; each world's seed stores the token of its own.
personas:
  dana:
    description: >-
      Dana Lee (dana), engineering manager at Orbit Payments and an owner of its Gitea
      organization, orbit
    headers:
      gitea: {Authorization: token ece66dadd3c117ab0a86bff7cc7b05a9c9e0b7ce}
  elena:
    description: >-
      Elena Petrova (elena), engineering manager at Ferrylane Logistics and an owner of its
      Gitea organization, ferrylane
    headers:
      gitea: {Authorization: token 8fe5394a32fb728adde9e5453cd31df20962d514}
  rahul:
    description: >-
      Rahul Mehta (rahul), engineering manager at Kestrel Health and an owner of its Gitea
      organization, kestrel
    headers:
      gitea: {Authorization: token 1c59c7e2f29234198256fc1464a929bee073503f}
sinks:
  smtp: 2525
  http: 9000
quiet:
  command: [su-exec, git, gitea, manager, flush-queues, --config, /etc/gitea/app.ini]
system_prompt: >-
  You are an assistant for a company's engineering team. You work in the company's Gitea, its
  Git forge, through Gitea's REST API: api_request sends a request as the person you act for,
  and api_docs looks up the API's operations. Repositories are named <organization>/<name>,
  issues and pull requests share one number sequence in each repository, and lists are
  paginated with page and limit (at most 50). Do what you are asked and nothing more, then call
  submit.
