# Gitea 28.3 as a Miroir world: the engineering organization of one of three companies, picked
# by the WORLD build argument. The agent reaches Gitea on port 3000; everything else stays on
# loopback.
expose: [3000]
processes:
  # TCP only, with no socket in /run. No durability: every trial starts from the image, and a
  # clean stop still writes every page.
  - name: db
    command: [postgres, -D, /var/lib/postgresql/data, -c, listen_addresses=127.0.0.1,
              -c, unix_socket_directories=, -c, fsync=off, -c, synchronous_commit=off,
              -c, full_page_writes=off]
    user: postgres
    datastore: true
    ready: {tcp: 5432}
  - name: gitea
    command: [gitea, web, --config, /etc/gitea/app.ini]
    user: git
    cwd: /var/lib/gitea
    ready: {http: "http://127.0.0.1:3000/api/healthz"}
env:
  # The image sets GITEA_CUSTOM to its /data volume, which keeps nothing a build writes, and
  # Gitea wants the work path to match app.ini's.
  GITEA_WORK_DIR: /var/lib/gitea
  GITEA_CUSTOM: /var/lib/gitea/custom
bake:
  # Names the forge and its mail sender after WORLD's company, before Gitea starts.
  - [python3, /opt/gitea-env/seed.py, configure]
  - [psql, -h, 127.0.0.1, -U, postgres, -v, ON_ERROR_STOP=1,
     -c, CREATE ROLE gitea LOGIN, -c, CREATE DATABASE gitea OWNER gitea]
  - [su-exec, git, gitea, migrate, --config, /etc/gitea/app.ini]
  - [su-exec, git, gitea, admin, user, create, --config, /etc/gitea/app.ini, --admin,
     --username, env-admin, --email, admin@env.test, --random-password,
     --must-change-password=false]
# Builds WORLD's company through Gitea's API, then writes the ids Gitea gave its rows to
# /opt/gitea-env/ids.json, where tasks.py reads them.
seed:
  - [python3, /opt/gitea-env/seed.py]
database:
  url: postgres://postgres@127.0.0.1:5432/gitea
  # What follows from other changes: the activity feed, notifications, read marks, webhook
  # deliveries and code statistics; and the token's last use, touched on every request.
  ignore: [action, notification, issue_user, hook_task, webhook.last_status,
           webhook.updated_unix, language_stat, repo_indexer_status, access_token.updated_unix]
  time:
    epoch: {"*.*_unix": s}
sinks:
  smtp: 2525
  http: 9000
# Gitea's queues live in memory (app.ini): this waits until they are empty.
quiet: [su-exec, git, gitea, manager, flush-queues, --config, /etc/gitea/app.ini]
