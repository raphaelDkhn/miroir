[project]
name = "miroir-openenv-conformance"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "mcp==1.30.0",
    "openenv==0.10.0",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
python_files = ["test_*.py"]
filterwarnings = ["ignore:connect\\(\\) must be used as a context manager:DeprecationWarning"]

[tool.ruff]
line-length = 100
